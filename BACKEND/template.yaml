            Method: GET
            RestApiId: !Ref ApiGateway

  EquipmentUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-update-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/update/
      Handler: handler.handler
      Description: Update equipment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/equipment/{id}
            Method: PUT
            RestApiId: !Ref ApiGateway

  EquipmentDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-delete-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/delete/
      Handler: handler.handler
      Description: Delete equipment
      Environment:
        Variables:
          FAULT_TREE_SERVICE_URL: ''
          FAULT_TREE_INTERNAL_KEY: ''
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
            - Effect: Allow
              Action:
                - iot:DeleteThing
                - iot:ListThingPrincipals
                - iot:DetachThingPrincipal
                - iot:ListAttachedPolicies
                - iot:DetachPolicy
                - iot:UpdateCertificate
                - iot:DeleteCertificate
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/equipment/{id}
            Method: DELETE
            RestApiId: !Ref ApiGateway

  # ==========================================
  # Equipment Action Functions (comandos)
  # ==========================================
  EquipmentActionGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-action-get-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/action/get/
      Handler: handler.handler
      Description: List equipment actions allowed for the caller role
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/equipment/{id}/action
            Method: GET
            RestApiId: !Ref ApiGateway

  EquipmentActionSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-action-send-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/action/send/
      Handler: handler.handler
      Description: Send a registered action (command) to the equipment via IoT Core
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
            # Publicação restrita aos tópicos de telemetria dos devices, que é onde o
            # contrato de comando ({type:'send'}) trafega
            - Effect: Allow
              Action:
                - iot:Publish
              Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/telemetry/*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/equipment/{id}/action
            Method: POST
            RestApiId: !Ref ApiGateway

  # ==========================================
  # IoT Telemetry Ingestion
  # ==========================================
  # Policy anexada ao certificado de cada device (equipment/new). Escopada por
  # iot:Connection.Thing.ThingName para permitir Connect/Publish/Receive/Subscribe
  # apenas no próprio tópico telemetry/{thingId} — Receive/Subscribe são
  # necessários para o device receber os comandos "send" do Virtual Technician,
  # publicados no mesmo tópico. Nome distinto da policy antiga (não gerenciada
  # por IaC, criada manualmente) para não colidir nem afetar certificados já
  # emitidos.
  DeviceIoTPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub 'plataforma-ati-iot-device-policy-${Stage}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Receive
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/telemetry/${!iot:Connection.Thing.ThingName}'
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/telemetry/${!iot:Connection.Thing.ThingName}'

  TelemetryRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-telemetry-router-${Stage}'
      CodeUri: 02_lambdas/saas/telemetry/router/
      Handler: handler.handler
      Description: Roteia telemetria MQTT do IoT Core para a tabela de telemetria
      Timeout: 15
      Environment:
        Variables:
          DYNAMODB_TABLE_TELEMETRY: !Sub 'plataforma-ati-${Stage}-tenant-equipment-telemetry'
          DEADBAND_PCT: "0.05"
          HEARTBEAT_SECONDS: "300"
          MIN_INTERVAL_SECONDS: "2"
      Policies:
        # Crud (não só Read) porque o Router atualiza lastSeen/lastValues/lastTelemetryAt
        # no próprio item do equipamento.
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment-telemetry'
      # Sem Events: — esta função é invocada pela AWS::IoT::TopicRule abaixo,
      # não por uma fonte de evento gerenciada pelo SAM, então a permissão de
      # invoke precisa ser declarada explicitamente (TelemetryRouterLambdaPermission).

  TelemetryRouterErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/iot/${Project}-telemetry-router-errors-${Stage}'
      RetentionInDays: 30

  IoTRuleErrorLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-iot-rule-error-logging-role-${Stage}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteErrorLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt TelemetryRouterErrorLogGroup.Arn

  TelemetryRouterTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'plataforma_ati_saas_telemetry_router_${Stage}'
      TopicRulePayload:
        Sql: "SELECT topic(2) as thingId, timestamp() as ruleTimestamp, * FROM 'telemetry/+'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryRouterFunction.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref TelemetryRouterErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLoggingRole.Arn

  TelemetryRouterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TelemetryRouterFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt TelemetryRouterTopicRule.Arn
      SourceAccount: !Ref AWS::AccountId

  # ==========================================
  # IAM Roles assumidas por outros serviços AWS (IoT Rules Engine, EventBridge
  # Scheduler) — consolidadas do antigo template IoT separado,
  # que nunca foi deployado por nenhum fluxo rastreado (nem deploy-full.ps1, nem
  # o Makefile). Antes desta migração essas roles só existiam na AWS (se
  # existissem) via algum deploy manual não rastreado do arquivo legado.
  # ==========================================
  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-iot-router-role-${Stage}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Uso real (virtual-technician/create|update via IOT_RULE_ROLE_ARN): role
        # assumida pela IoT Rule dinâmica de cada action/notification para
        # publicar na fila SQS correspondente (ação "sqs" da TopicRule) —
        # precisa de sqs:SendMessage, não lambda:InvokeFunction (era isso que a
        # definição legada continha, incorretamente, para um Router Lambda que
        # nunca chegou a existir).
        - PolicyName: SendToVirtualTechnicianQueues
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt VirtualTechnicianActionQueue.Arn
                  - !GetAtt VirtualTechnicianNotificationQueue.Arn

  IoTAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-iot-access-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IoTMQTTAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:Connect
                  - iot:Subscribe
                  - iot:Receive
                  - iot:Publish
                  - iot:DescribeEndpoint
                Resource: '*'

  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-eventbridge-role-${Stage}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeVirtualTechnicianExecutor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Project}-saas-virtual-technician-executor-${Stage}'

