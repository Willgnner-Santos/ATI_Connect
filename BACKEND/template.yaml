          Type: Api
          Properties:
            Path: /saas/equipment
            Method: GET
            RestApiId: !Ref ApiGateway

  EquipmentNewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-new-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/new/
      Handler: handler.handler
      Description: Create new equipment
      Environment:
        Variables:
          IOT_POLICY: !Ref DeviceIoTPolicy
          FAULT_TREE_SERVICE_URL: ''
          FAULT_TREE_INTERNAL_KEY: ''
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
            - Effect: Allow
              Action:
                - iot:CreateThing
                - iot:CreateKeysAndCertificate
                - iot:AttachThingPrincipal
                - iot:AttachPolicy
                - iot:DescribeEndpoint
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/equipment
            Method: POST
            RestApiId: !Ref ApiGateway

  EquipmentViewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-equipment-view-${Stage}'
      CodeUri: 02_lambdas/saas/equipment/view/
      Handler: handler.handler
      Description: View equipment details
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - Statement:
            - Effect: Allow
