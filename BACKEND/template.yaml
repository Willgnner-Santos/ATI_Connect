AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plataforma ATI - SaaS Multi-Tenant Backend

# ============================================
# Globals - Configurações compartilhadas
# ============================================
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - x86_64
    Environment:
      Variables:
        REGION: !Ref AWS::Region
        STAGE: !Ref Stage
        DYNAMODB_TABLE: !Sub 'plataforma-ati-${Stage}'
        DYNAMODB_TABLE_ORGANIZATIONS: !Sub 'plataforma-ati-${Stage}-organizations'
        DYNAMODB_TABLE_TENANTS: !Sub 'plataforma-ati-${Stage}-tenants'
        DYNAMODB_TABLE_USERS: !Sub 'plataforma-ati-${Stage}-tenant-users'
        DYNAMODB_TABLE_EQUIPMENT: !Sub 'plataforma-ati-${Stage}-tenant-equipment'
        DYNAMODB_TABLE_ROLES: !Sub 'plataforma-ati-${Stage}-organization-roles'
        DYNAMODB_TABLE_AUDIT: !Sub 'plataforma-ati-${Stage}-audit-log'
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
    Layers:
      - !Ref LayerArn

# ============================================
# Parameters
# ============================================
Parameters:
  Stage:
    Type: String
    Default: sandbox
    AllowedValues:
      - sandbox
      - staging
      - production
    Description: Deployment stage

  Project:
    Type: String
    Default: plataforma-ati
    Description: Project name

  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Origem permitida pelo CORS; informar o domínio do frontend fora do sandbox.

  LayerArn:
    Type: String
    Description: ARN da Lambda Layer plataforma_ati (incluindo versão). Passar explicitamente no deploy.

  TelegramBotToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Telegram Bot Token para envio de mensagens

  FirebaseServiceAccountSsmParam:
    Type: String
    Default: ""
    Description: Caminho do parâmetro SSM (SecureString) com o JSON da service account do Firebase


# ============================================
# Resources
# ============================================
Resources:

  # ==========================================
  # Lambda Layer (Imported from existing stack)
  # ==========================================
  # PlataformaAtiLayer is imported via !ImportValue from plataforma-ati-layer-sandbox stack

  # ==========================================
  # Authentication Functions
  # ==========================================
  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-auth-login-${Stage}'
      CodeUri: 02_lambdas/saas/auth/login/
      Handler: handler.handler
      Description: SaaS Login - Authenticate user
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:GetUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/auth/login
            Method: POST
            RestApiId: !Ref ApiGateway

  AuthRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-auth-refresh-${Stage}'
      CodeUri: 02_lambdas/saas/auth/refresh/
      Handler: handler.handler
      Description: SaaS Refresh Token
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminInitiateAuth
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/auth/refresh
            Method: POST
            RestApiId: !Ref ApiGateway

  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-auth-logout-${Stage}'
      CodeUri: 02_lambdas/saas/auth/logout/
      Handler: handler.handler
      Description: SaaS Logout - Invalidate token
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GlobalSignOut
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/auth/logout
            Method: POST
            RestApiId: !Ref ApiGateway

  AuthForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-auth-forgot-password-${Stage}'
      CodeUri: 02_lambdas/saas/auth/forgot-password/
      Handler: handler.handler
      Description: SaaS Forgot Password - Request reset code
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ForgotPassword
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/auth/forgot-password
            Method: POST
            RestApiId: !Ref ApiGateway

  AuthResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-auth-reset-password-${Stage}'
      CodeUri: 02_lambdas/saas/auth/reset-password/
      Handler: handler.handler
      Description: SaaS Reset Password - Confirm new password
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmForgotPassword
                - cognito-idp:AdminUserGlobalSignOut
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/auth/reset-password
            Method: POST
            RestApiId: !Ref ApiGateway

  # ==========================================
  # Organization Functions
  # ==========================================
  OrganizationGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-organization-get-${Stage}'
      CodeUri: 02_lambdas/saas/organization/get/
      Handler: handler.handler
      Description: List organizations
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/organization
            Method: GET
            RestApiId: !Ref ApiGateway

  OrganizationNewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-organization-new-${Stage}'
      CodeUri: 02_lambdas/saas/organization/new/
      Handler: handler.handler
      Description: Create new organization
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-users'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/organization
            Method: POST
            RestApiId: !Ref ApiGateway

  OrganizationDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-organization-delete-${Stage}'
      CodeUri: 02_lambdas/saas/organization/delete/
      Handler: handler.handler
      Description: Soft delete organization
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-users'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDisableUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/organization/{id}
            Method: DELETE
            RestApiId: !Ref ApiGateway

  OrganizationReactivateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-organization-reactivate-${Stage}'
      CodeUri: 02_lambdas/saas/organization/reactivate/
      Handler: handler.handler
      Description: Reactivate organization
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-organizations'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-users'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminEnableUser
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /saas/organization/{id}/reactivate
            Method: POST
            RestApiId: !Ref ApiGateway

