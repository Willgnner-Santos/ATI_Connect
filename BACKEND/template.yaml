  # ==========================================
  VirtualTechnicianActionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-virtual-technician-action-${Stage}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VirtualTechnicianActionDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: !Ref Project
        - Key: stage
          Value: !Ref Stage

  VirtualTechnicianNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-virtual-technician-notification-${Stage}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VirtualTechnicianNotificationDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: !Ref Project
        - Key: stage
          Value: !Ref Stage

  VirtualTechnicianExecutorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-virtual-technician-executor-${Stage}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VirtualTechnicianExecutorDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: !Ref Project
        - Key: stage
          Value: !Ref Stage

  VirtualTechnicianNotifierQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-virtual-technician-notifier-${Stage}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VirtualTechnicianNotifierDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: !Ref Project
        - Key: stage
          Value: !Ref Stage

  # ==========================================
  # Virtual Technician Processing Lambdas
  # ==========================================
  VirtualTechnicianValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-virtual-technician-validator-${Stage}'
      CodeUri: 02_lambdas/saas/virtual-technician/validator/
      Handler: handler.handler
      Description: Validate conditions before executing actions
      Environment:
        Variables:
          DYNAMODB_TABLE_VIRTUAL_TECHNICIAN: !Sub 'plataforma-ati-${Stage}-virtual-technician'
          EXECUTOR_QUEUE_URL: !Ref VirtualTechnicianExecutorQueue
          NOTIFIER_QUEUE_URL: !Ref VirtualTechnicianNotifierQueue
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-virtual-technician'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VirtualTechnicianExecutorQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VirtualTechnicianNotifierQueue.QueueName
      Events:
        ActionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VirtualTechnicianActionQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VirtualTechnicianNotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  VirtualTechnicianExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-virtual-technician-executor-${Stage}'
      CodeUri: 02_lambdas/saas/virtual-technician/executor/
      Handler: handler.handler
      Description: Execute MQTT actions
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_TABLE_EQUIPMENT: !Sub 'plataforma-ati-${Stage}-tenant-equipment'
          DYNAMODB_TABLE_VIRTUAL_TECHNICIAN: !Sub 'plataforma-ati-${Stage}-virtual-technician'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-equipment'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-virtual-technician'
        - Statement:
            - Effect: Allow
              Action:
                - iot:Publish
              Resource: '*'
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VirtualTechnicianExecutorQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  VirtualTechnicianNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Project}-saas-virtual-technician-notifier-${Stage}'
      CodeUri: 02_lambdas/saas/virtual-technician/notifier/
      Handler: handler.handler
      Description: Send email and SMS notifications
      Timeout: 30
      Environment:
        Variables:
          SENDER_EMAIL: noreply@plataforma-ati.com
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          DYNAMODB_TABLE_VIRTUAL_TECHNICIAN: !Sub 'plataforma-ati-${Stage}-virtual-technician'
          DYNAMODB_TABLE_PUSH_SUBSCRIPTIONS: !Sub '${Project}-${Stage}-push-subscriptions'
          FIREBASE_SERVICE_ACCOUNT_SSM_PARAM: !Ref FirebaseServiceAccountSsmParam
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-virtual-technician'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-push-subscriptions'
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirebaseServiceAccountSsmParam}'
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VirtualTechnicianNotifierQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ==========================================
  # API Gateway
  # ==========================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${Project}-saas-api-${Stage}'
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
      Auth:
        ApiKeyRequired: false

# ============================================
# Outputs
# ============================================
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
    Export:
      Name: !Sub '${Project}-saas-api-endpoint-${Stage}'

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
    Export:
      Name: !Sub '${Project}-saas-api-id-${Stage}'

  LayerArn:
    Description: Lambda Layer ARN usada neste deploy
    Value: !Ref LayerArn
