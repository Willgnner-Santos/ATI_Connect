      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenants'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Project}-${Stage}-organization-roles'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${Project}-${Stage}-tenant-users'
        - Statement:
