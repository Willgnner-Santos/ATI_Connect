openapi: 3.0.3
info:
  title: Plataforma ATI - SaaS API
  version: 2.0.0
  description: |
    API RESTful multi-tenant para gerenciamento de equipamentos IoT.

    ## Arquitetura

    Sistema hierárquico: **PLATFORM** → **Organization** → **Tenant** → **Users/Equipment**

    ## Autenticação

    1. Fazer login em `/saas/auth/login`
    2. Usar o `access_token` no header `Authorization: Bearer {token}`
    3. Tokens expiram em 1 hora, use `/saas/auth/refresh` para renovar

    ## Permissões

    Sistema de roles dinâmico por organização:
    - **superadmin**: Acesso total ao sistema
    - **collaborator**: Administra todas as organizações, sem privilégios reservados de plataforma
    - **admin**: Administrador da organização
    - **manager**: Gerente de tenant
    - **viewer**: Visualizador (apenas leitura)

  contact:
    name: CloudFaster Tecnologia
    email: suporte@cloudfaster.com.br
    url: https://cloudfaster.com.br
  license:
    name: Proprietary

servers:
  - url: https://2wdbgmcijd.execute-api.sa-east-1.amazonaws.com/sandbox
    description: Sandbox
  - url: https://api.plataforma-ati.com/production
    description: Production (TBD)

tags:
  - name: Authentication
    description: Autenticação e gerenciamento de senha
  - name: Catalog
    description: Gerenciamento do catálogo global de sensores
  - name: Organizations
    description: Gerenciamento de organizações (distribuidoras)
  - name: Tenants
    description: Gerenciamento de tenants (clientes finais)
  - name: Users
    description: Gerenciamento de usuários
  - name: Equipment
    description: Gerenciamento de equipamentos IoT
  - name: Dashboard
    description: Dashboard com telemetria de equipamentos
  - name: Virtual Technician
    description: Automações e ações programadas
  - name: Report
    description: Relatórios de telemetria

security:
  - BearerAuth: []

paths:
  /saas/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      description: Autentica usuário e retorna tokens JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@plataforma-ati.com
                password:
                  type: string
                  format: password
                  example: senha-configurada-no-ambiente
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Login realizado com sucesso
                  data:
                    type: object
                    properties:
                      authorization:
                        type: object
                        properties:
                          access_token:
                            type: string
                            description: Token de acesso (válido por 1 hora)
                          refresh_token:
                            type: string
                            description: Token de refresh (válido por 30 dias). Armazene para renovar o access_token via /saas/auth/refresh.
                          id_token:
                            type: string
                            description: Token de identidade JWT com dados do usuário.
                          iot:
                                type: object
                                description: Credenciais para conexão MQTT do equipamento. A chave privada deve ser armazenada com segurança.
                                properties:
                                  endpoint:
                                    type: string
                                  certificatePem:
                                    type: string
                                    description: Certificado X.509 do equipamento em formato PEM.
                                  privateKey:
                                    type: string
                                    description: Chave privada do equipamento em formato PEM.
                                  amazonRootCA1:
                                    type: string
                                    description: Certificado raiz público Amazon Root CA 1 em formato PEM.
                          expires_in:
                            type: integer
                            example: 3600
                          token_type:
                            type: string
                            example: Bearer
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /saas/auth/refresh:
    post:
      tags: [Authentication]
      summary: Renovar token
      description: Renova o access_token usando refresh_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, username]
              properties:
                refreshToken:
                  type: string
                  description: Refresh token obtido no login
                username:
                  type: string
                  description: Username (sub) do usuário
                  example: f36c7a9a-70b1-7032-34cf-3f76c353ee47
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      id_token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /saas/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: Invalida o token atual (global sign-out)
      responses:
        '200':
          description: Logout realizado

  /saas/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Solicitar recuperação de senha
      description: |
        Envia um código de recuperação para o e-mail informado.
        Por segurança, sempre retorna 200 com a mesma mensagem genérica,
        independente de o e-mail existir ou não no Cognito.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@plataforma-ati.com
      responses:
        '200':
          description: Solicitação processada (mensagem genérica)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Se o e-mail estiver cadastrado, você receberá um código de recuperação

  /saas/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Confirmar nova senha
      description: Confirma o código de recuperação e define a nova senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: Código de verificação recebido por e-mail
                newPassword:
                  type: string
                  format: password
                  description: Nova senha (mínimo 8 caracteres)
      responses:
        '200':
          description: Senha alterada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Senha alterada com sucesso
        '400':
          description: Código inválido/expirado ou senha inválida

  /saas/organization:
    get:
      tags: [Organizations]
      summary: Listar organizações
      description: |
        Lista organizações disponíveis.
        - **Superadmin/Collaborator**: Veem todas as organizações de negócio
        - **Admin**: Vê apenas a própria organização
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: ID específico da organização (opcional)
        - name: status
          in: query
          schema:
            type: string
          description: Filtrar por status (ex. 'active', 'inactive' ou 'all')
      responses:
        '200':
          description: Lista de organizações
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Organization'
                      - type: array
                        items:
                          $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Organizations]
      summary: Criar organização
      description: |
        Cria nova organização (roles globais superadmin ou collaborator).
        O `name` e o `cnpj` devem ser únicos entre organizações ativas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, cnpj]
              properties:
                name:
                  type: string
                  description: Nome da organização (único entre organizações ativas)
                  example: Distribuidora ABC Ltda
                email:
                  type: string
                  format: email
                  example: contato@distribuidora-abc.com
                cnpj:
                  type: string
                  description: |
                    CNPJ da organização — obrigatório e único. Aceita formato com máscara
                    (`XX.XXX.XXX/XXXX-XX`) ou somente os 14 caracteres alfanuméricos.
                    Suporta o novo formato alfanumérico (vigência 2026).
                  example: AB.123.456/0001-78
                type:
                  type: string
                  enum: [ati, distributor]
                  default: distributor
                admin:
                  type: object
                  description: Criar usuário admin automático (opcional)
                  properties:
                    name:
                      type: string
                      example: João Silva
                    email:
                      type: string
                      format: email
                      example: joao@distribuidora-abc.com
                    password:
                      type: string
                      format: password
                      example: Admin@2026
                    role:
                      type: string
                      default: admin
      responses:
        '201':
          description: Organização criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      organizationId:
                        type: string
                      userId:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /saas/organization/{id}:
    delete:
      tags: [Organizations]
      summary: Soft delete organização
      description: Realiza a exclusão lógica da organização (roles globais ou o próprio admin da organização).
      parameters:
        - name: id
          in: path
          required: true
          description: ID da organização a ser excluída
          schema:
            type: string
      responses:
        '200':
          description: Organização excluída com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Organização deletada com sucesso
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organização não encontrada

  /saas/organization/{id}/reactivate:
    post:
      tags: [Organizations]
      summary: Reativar organização
      description: Realiza a reativação da organização e de todos os seus usuários associados no Cognito (roles globais).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID da organização a ser reativada
      responses:
        '200':
          description: Organização reativada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Organização reativada com sucesso
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organização não encontrada

  /saas/tenant:
    get:
      tags: [Tenants]
      summary: Listar tenants
      description: Lista tenants da organização
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
          description: ID da organização
        - name: tenantId
          in: query
          schema:
            type: string
          description: ID específico do tenant (opcional)
        - name: status
          in: query
          schema:
            type: string
          description: Filtrar por status (ex. 'active', 'inactive' ou 'all')
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'

    post:
      tags: [Tenants]
      summary: Criar tenant
      description: |
        Cria novo tenant (cliente) dentro da organização.
        O `name`, `cnpj` e `cpf` devem ser únicos dentro da organização.
        Obrigatório informar `cnpj` (pessoa jurídica) **ou** `cpf` (pessoa física) — não ambos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, name]
              properties:
                organizationId:
                  type: string
                  description: ID da organização
                name:
                  type: string
                  description: Nome do tenant (único dentro da organização)
                  example: Cliente ABC Ltda
                cnpj:
                  type: string
                  description: |
                    CNPJ do tenant (pessoa jurídica). Obrigatório se `cpf` não for informado.
                    Aceita formato com máscara (`XX.XXX.XXX/XXXX-XX`) ou 14 caracteres alfanuméricos.
                    Suporta o novo formato alfanumérico (vigência 2026).
                  example: AB.123.456/0001-78
                cpf:
                  type: string
                  description: |
                    CPF do tenant (pessoa física). Obrigatório se `cnpj` não for informado.
                    Aceita formato com máscara (`XXX.XXX.XXX-XX`) ou 11 dígitos.
                  example: 123.456.789-09
                user:
                  type: object
                  description: Criar usuário admin automático (opcional)
                  properties:
                    name:
                      type: string
                      example: João Silva
                    email:
                      type: string
                      format: email
                      example: joao@cliente-abc.com
                    password:
                      type: string
                      format: password
                      example: Senha@2026
                    role:
                      type: string
                      default: admin
      responses:
        '201':
          description: Tenant criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tenantId:
                        type: string
                      userId:
                        type: string

  /saas/tenant/{id}:
    delete:
      tags: [Tenants]
      summary: Soft delete tenant
      description: Realiza a exclusão lógica do tenant (roles globais ou admin/gerente da própria organização).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID da tenant a ser excluída
      responses:
        '200':
          description: Tenant excluído com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Tenant deletado com sucesso
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tenant não encontrado

  /saas/tenant/{id}/reactivate:
    post:
      tags: [Tenants]
      summary: Reativar tenant
      description: Realiza a reativação do tenant e de todos os seus usuários associados no Cognito (roles globais ou admin da própria organização).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do tenant a ser reativado
      responses:
        '200':
          description: Tenant reativado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Tenant reativado com sucesso
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tenant não encontrado

  /saas/user:
    get:
      tags: [Users]
      summary: Listar usuários
      description: Lista usuários da organização/tenant
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      tags: [Users]
      summary: Criar usuário
      description: |
        Cria novo usuário e registra no Cognito + DynamoDB.

        **Permissões:**
        - Superadmin/Collaborator: podem criar em qualquer organização de negócio/tenant
        - Admin: só pode criar na própria organização
        - Manager: só pode criar no próprio tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, organizationId, role]
              properties:
                name:
                  type: string
                  description: Nome completo
                  example: João Silva
                email:
                  type: string
                  format: email
                  description: Email (username no Cognito, deve ser único)
                  example: joao.silva@cliente-abc.com
                organizationId:
                  type: string
                  description: ID da organização
                tenantId:
                  type: string
                  description: ID do tenant (opcional, se omitido fica no nível org)
                role:
                  type: string
                  description: Role do usuário
                  enum: [superadmin, collaborator, admin, manager, viewer]
                  example: admin
                tenantRole:
                  type: string
                  description: Role operacional global do usuário no tenant.
                  enum: [client, technician]
                  example: technician
                password:
                  type: string
                  format: password
                  description: Senha inicial (se omitido, Cognito envia email)
                  example: Senha@2026
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      organizationId:
                        type: string
                      tenantId:
                        type: string

  /saas/user/{id}:
    put:
      tags: [Users]
      summary: Atualizar usuário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: Email (atualização do Cognito, deve ser único)
                role:
                  type: string
                tenantRole:
                  type: string
                  enum: [gestor, tecnico, user, manager, technician, client]
                status:
                  type: string
                  enum: [active, inactive]
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Usuário atualizado

    delete:
      tags: [Users]
      summary: Deletar usuário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuário deletado

  /saas/user/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reativar usuário
      description: Realiza a reativação do usuário no Cognito e no DynamoDB (roles globais, admin da própria org ou manager do mesmo tenant).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID do usuário a ser reativado
      responses:
        '200':
          description: Usuário reativado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Usuário reativado com sucesso
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Usuário não encontrado

  /saas/equipment:
    get:
      tags: [Equipment]
      summary: Listar equipamentos
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de equipamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Equipment'

    post:
      tags: [Equipment]
      summary: Criar equipamento
      description: |
        Cria novo equipamento IoT com certificados e Thing no AWS IoT Core.

        **O que acontece:**
        1. Valida `modelId` no catálogo da organização (se informado)
        2. Cria IoT Thing no AWS IoT Core
        3. Gera certificado X.509 para autenticação
        4. Vincula certificado à Thing
        5. Aplica política IoT padrão
        6. Salva equipamento no DynamoDB (com `modelId` quando fornecido)
        7. Retorna credenciais IoT
        8. Copia a árvore de falhas do modelo para o equipamento (best-effort, não bloqueia)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, tenantId, name, equipmentType, model, local, sensors]
              properties:
                organizationId:
                  type: string
                tenantId:
                  type: string
                name:
                  type: string
                  description: Nome/identificação do equipamento
                  example: Elevador Social - Bloco A
                equipmentType:
                  type: string
                  description: Tipo do equipamento
                  enum: [elevator, pump, generator, ac, hvac, security, custom]
                  example: elevator
                model:
                  type: string
                  description: Modelo do equipamento (texto livre, usado para gerar o nome da IoT Thing)
                  example: Atlas HydroX 2000
                modelId:
                  type: string
                  description: |
                    ID do modelo de equipamento no catálogo da organização (opcional).
                    Quando informado, vincula o equipamento ao modelo e dispara a cópia da
                    árvore de falhas do modelo para o equipamento no serviço arvore-de-falhas.
                    Formato: letras minúsculas, dígitos e underscores (`^[a-z0-9_]+$`).
                  pattern: '^[a-z0-9_]+$'
                  example: bomba_centrifuga_v2
                local:
                  type: string
                  description: Localização física
                  example: Edifício Central - Bloco A
                sensors:
                  type: object
                  description: Definição dos sensores/pontos de monitoramento
                  example:
                    temperature:
                      sensorType: "temperature"
                      unit: "°C"
                      name: "Temperatura do Motor"
                    vibration:
                      sensorType: "analog"
                      unit: "Hz"
                      name: "Vibração"
                    door_status:
                      sensorType: "digital"
                      unit: "bool"
                      name: "Status da Porta"
                commands:
                  type: object
                  description: |
                    Comandos do equipamento (opcional). Chave = nome da variável enviada ao device.
                    Cada entrada precisa de `name` (string), `resource` (string) e `dataType` (bool/int/float/string).
                    Campo opcional `allowedRoles` (lista de strings): se ausente, todos os papéis podem disparar;
                    se lista vazia, nenhum papel pode disparar.
                  example:
                    relay1:
                      name: "Relay 1"
                      resource: "relay1"
                      dataType: "bool"
                      allowedRoles: ["tecnico"]
                states:
                  type: object
                  description: |
                    Estados interpretados do equipamento — não é leitura bruta de sensor,
                    é uma interpretação (ex: "andar", "subindo"). Variável livre igual sensor,
                    mas sem catálogo global: só exige um dataType primitivo (int/string/bool).
                    Opcional.
                  example:
                    andar:
                      dataType: int
                      name: "Andar Atual"
                    subindo:
                      dataType: bool
                      name: "Subindo"
      responses:
        '201':
          description: Equipamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      equipmentId:
                        type: string
                      thingName:
                        type: string
                      iot:
                        type: object
                        description: Credenciais IoT — retornadas UMA ÚNICA VEZ na criação. Armazene imediatamente.
                        properties:
                          endpoint:
                            type: string
                            description: Endpoint MQTT do AWS IoT Core
                          certificatePem:
                            type: string
                            description: Certificado X.509 em formato PEM. Salvar como certificate.pem.crt
                          privateKey:
                            type: string
                            description: Chave privada em formato PEM. Salvar como private.pem.key — manter em segredo.
                          amazonRootCA1:
                            type: string
                            description: Certificado raiz Amazon Root CA 1 em formato PEM. Salvar como AmazonRootCA1.pem

