  /saas/report:
    get:
      tags: [Report]
      summary: Gerar relatório de telemetria
      description: |
        Gera relatório com dados de telemetria em um período de tempo.

        **Filtros**:
        - Range de datas (obrigatório, máx 30 dias)
        - Equipamento específico (opcional)
        - Variáveis/sensores (opcional)
      parameters:
        - name: organizationId
          in: query
          description: Obrigatório para roles globais
          schema:
            type: string
        - name: tenantId
          in: query
          description: Obrigatório para roles globais e administradores sem tenant fixo
          schema:
            type: string
        - name: start
          in: query
          required: true
          description: Data inicial (ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2026-05-21T10:00:00Z"
        - name: end
          in: query
          required: true
          description: Data final (ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2026-05-21T18:00:00Z"
        - name: equipmentId
          in: query
          description: Filtrar por equipamento específico
          schema:
            type: string
        - name: variables
          in: query
          description: Variáveis separadas por vírgula (ex temperature,humidity)
          schema:
            type: string
            example: "temperature,humidity,pressure"
      responses:
        '200':
          description: Relatório gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      equipment:
                        type: array
                        items:
                          type: object
                          properties:
                            equipmentId:
                              type: string
                            name:
                              type: string
                            sensors:
                              type: array
                              items:
                                type: object
                                properties:
                                  variable:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        timestamp:
                                          type: integer
                                        datetime:
                                          type: string
                                        value:
                                          oneOf:
                                            - type: number
                                            - type: string
                            states:
                              type: array
                              description: Estados interpretados do equipamento (ex "andar", "subindo") no mesmo intervalo — mesmo formato de sensors, sem fallback de último valor (fora do intervalo é 'sem dado' mesmo).
                              items:
                                type: object
                                properties:
                                  variable:
                                    type: string
                                  values:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        timestamp:
                                          type: integer
                                        datetime:
                                          type: string
                                        value:
                                          oneOf:
                                            - type: integer
                                            - type: string
                                            - type: boolean
                      period:
                        type: object
                        properties:
                          start:
                            type: string
                          end:
                            type: string
                      summary:
                        type: object
                        properties:
                          totalEquipment:
                            type: integer
                          totalDataPoints:
                            type: integer

  /saas/push-subscriptions:
    post:
      tags: [Push Notifications]
      summary: Registrar subscription de push notification
      description: |
        Registra o FCM token do dispositivo para receber push notifications.
        Deve ser chamado pelo app mobile após o login e sempre que o token FCM for renovado.

        **Plataformas suportadas**: `android`, `ios`

        Se o mesmo `deviceToken` já estiver registrado para o usuário, apenas atualiza o `updatedAt` sem criar duplicata.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken, platform]
              properties:
                deviceToken:
                  type: string
                  description: FCM token obtido pelo Firebase SDK no dispositivo
                  example: "fGZ3...token_fcm"
                platform:
                  type: string
                  enum: [android, ios]
                  description: Plataforma do dispositivo
                  example: "android"
      responses:
        '201':
          description: Subscription registrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Push subscription registrada com sucesso
                  data:
                    type: object
                    properties:
                      subscriptionId:
                        type: string
                        format: uuid
                      platform:
                        type: string
                        enum: [android, ios]
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado

  /saas/push-subscriptions/{id}:
    delete:
      tags: [Push Notifications]
      summary: Remover subscription de push notification
      description: |
        Remove o registro de push notification do dispositivo.
        Deve ser chamado ao fazer logout ou quando o usuário desativar notificações.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da subscription retornado no registro
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription removida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Push subscription removida com sucesso
        '401':
          description: Não autorizado
        '404':
          description: Subscription não encontrada

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido no login

  schemas:
    Organization:
      type: object
      properties:
        organizationId:
          type: string
        name:
          type: string
        cnpj:
          type: string
          description: CNPJ normalizado (14 chars alfanuméricos, maiúsculos, sem máscara)
          example: AB1234560001789
        type:
          type: string
          enum: [ati, distributor]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        tenantId:
          type: string
        organizationId:
          type: string
        name:
          type: string
        cnpj:
          type: string
          description: CNPJ normalizado (pessoa jurídica — 14 chars alfanuméricos, maiúsculos, sem máscara)
          example: AB1234560001789
        cpf:
          type: string
          description: CPF normalizado (pessoa física — 11 dígitos, sem máscara)
          example: "12345678909"
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [active, inactive]

    Equipment:
      type: object
      properties:
        equipmentId:
          type: string
        organizationId:
          type: string
        tenantId:
          type: string
        name:
          type: string
        type:
          type: string
        model:
          type: string
        local:
          type: string
        thingId:
          type: string
          description: Nome da Thing IoT associada ao equipamento.
        endpoint:
          type: string
          description: Endpoint MQTT do IoT Core.
        topic:
          type: string
          example: telemetry/ati-elevador-social-bloco-a
        sensors:
          type: object
        states:
          type: object
          description: Estados interpretados do equipamento (ex "andar", "subindo") — mesmo formato de sensors, sem catálogo, só dataType (int/string/bool).
        commands:
          type: object
          description: Comandos configurados no equipamento; ausente equivale a objeto vazio.
          additionalProperties:
            type: object
            required: [name, dataType, resource]
            additionalProperties: false
            properties:
              name: {type: string}
              dataType: {type: string, enum: [bool, int, float, string]}
              resource: {type: string}
              allowedRoles:
                type: array
                items: {type: string}
                description: Roles permitidos. Ausente = todos; lista vazia = nenhum.
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: Última vez que o equipamento enviou telemetria (mantido pelo Router).
        lastValues:
          type: object
          description: Último valor conhecido de cada sensor/estado (mantido pelo Router a cada mensagem recebida).
        status:
          type: string
          enum: [active, inactive, maintenance]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SensorType:
      type: object
      required: [typeId, name, category]
      properties:
        typeId:
          type: string
          example: vibration
        name:
          type: string
          example: Sensor de Vibração
        category:
          type: string
          enum: [analog, digital, relay, string]
        defaultUnit:
          type: string
          example: Hz
        description:
          type: string

    EquipmentModel:
      type: object
      required: [modelId, name, equipmentType, sensors]
      properties:
        organizationId:
          type: string
          example: PLATFORM
          description: ID da organização (roles globais podem definir qualquer organização de negócio)
        modelId:
          type: string
          example: otis_gen2
        name:
          type: string
          example: Otis Gen2
        equipmentType:
          type: string
          example: elevator
        sensors:
          type: object
          description: Definições de variáveis e tipos de sensores mapeados
          example:
            temp_cabine:
              sensorType: temperature_celsius
              name: Sensor de Cabine
              unit: "°C"
        states:
          type: object
          description: Estados interpretados (ex "andar", "subindo") — mesmo formato de sensors, sem catálogo, só dataType (int/string/bool). Opcional.
          example:
            andar:
              dataType: int
              name: "Andar Atual"
        commands:
          type: object
          description: Comandos suportados pelo modelo. Opcional; ausente equivale a objeto vazio.
          additionalProperties:
            type: object
            required: [name, dataType, resource]
            additionalProperties: false
            properties:
              name: {type: string}
              dataType: {type: string, enum: [bool, int, float, string]}
              resource: {type: string}
              allowedRoles:
                type: array
                items: {type: string}
                description: Roles permitidos. Ausente = todos; lista vazia = nenhum.

    VirtualTechnicianAction:
      type: object
      properties:
        actionId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [action, notification, schedule]
        equipmentId:
          type: string
        equipmentName:
          type: string
        status:
          type: string
          enum: [active, inactive]
        conditions:
          type: array
          items:
            type: object
            properties:
              variable:
                type: string
              operator:
                type: string
                enum: ['=', '>', '<', '>=', '<=', '!=']
              value:
                type: string
              type:
                type: string
                enum: [string, number, boolean]
              condition:
                type: string
                enum: [AND, OR]
        actions:
          type: array
          items:
            type: object
            properties:
              variable:
                type: string
              value:
                type: string
              type:
                type: string
                enum: [string, number, boolean]
              delay:
                type: string
        notification:
          type: object
        schedule:
          type: object
        ruleName:
          type: string
        scheduleName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: object

  responses:
    Unauthorized:
      description: Token inválido ou não informado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Token não informado

    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            message: Acesso negado para esta organização

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Recurso não encontrado
