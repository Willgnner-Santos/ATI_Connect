[pytest]
# Safe default: integration tests in tests/ must be selected explicitly.
testpaths = tests_unit
timeout = 60
# O timeout vale só para a fase de execução do teste. Sem isso ele engloba o setup
# dos fixtures de sessão (sam build das ~40 funções + start-api + criação de
# org/tenant/usuários de QA, vários minutos) e o primeiro teste morre sempre.
timeout_func_only = true
