# ============================================================
# docker-compose.portainer.yml — Stack para Portainer
# ============================================================
# Portainer > Stacks > Add Stack
# Defina as variáveis na aba "Environment variables" do stack.
#
# Variáveis sem default (obrigatórias — stack não sobe sem elas):
#   AWS_ACCESS_KEY_ID         AWS_SECRET_ACCESS_KEY
#   COGNITO_USER_POOL_ID      COGNITO_CLIENT_ID
#   POSTGRES_PASSWORD         RABBITMQ_PASSWORD
#   S3_ACCESS_KEY             S3_SECRET_KEY
#   INTERNAL_API_KEY
#   CORS_ALLOWED_ORIGINS      S3_PUBLIC_ENDPOINT_URL
# ============================================================

x-app-env: &app-env

  # ── AWS Bedrock ──────────────────────────────────────────
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
  MODEL_ID: ${MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
  EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}

  # ── PostgreSQL ───────────────────────────────────────────
  POSTGRES_URI: postgresql://arvore_admin:${POSTGRES_PASSWORD}@postgres:5432/arvore_falhas

  # ── Qdrant ───────────────────────────────────────────────
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
  QDRANT_UPSERT_BATCH_SIZE: ${QDRANT_UPSERT_BATCH_SIZE:-100}

  # ── S3 / RustFS ──────────────────────────────────────────
  S3_BUCKET: ${S3_BUCKET:-plataforma-ati-sandbox}
  S3_REGION: ${S3_REGION:-sa-east-1}
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
  S3_USE_PATH_STYLE: "true"
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfs-admin}
  S3_SECRET_KEY: ${S3_SECRET_KEY}

  # ── RabbitMQ ─────────────────────────────────────────────
  AMQP_URL: amqp://arvore_admin:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  REQUEST_QUEUE: ${REQUEST_QUEUE:-docs.ingest.requests}
  RESPONSE_QUEUE: ${RESPONSE_QUEUE:-docs.ingest.responses}
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-document-processing}
  RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
  ENABLE_OUTBOX_PUBLISHER: ${ENABLE_OUTBOX_PUBLISHER:-true}
  ENABLE_REQUEST_CONSUMER: ${ENABLE_REQUEST_CONSUMER:-true}
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-5}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}

  # ── Cognito / Auth ───────────────────────────────────────
  COGNITO_REGION: ${COGNITO_REGION:-sa-east-1}
  COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
  COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  # ── DynamoDB (opcional) ──────────────────────────────────
  DYNAMODB_TABLE_ROLES: ${DYNAMODB_TABLE_ROLES:-}
  DYNAMODB_REGION: ${DYNAMODB_REGION:-sa-east-1}

  # ── Tunables ─────────────────────────────────────────────
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  MAX_WORKERS: ${MAX_WORKERS:-4}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  STALE_JOB_MINUTES: ${STALE_JOB_MINUTES:-30}
  IMAGE_CATALOG_MAX_PER_DOC: ${IMAGE_CATALOG_MAX_PER_DOC:-50}
  CHUNK_SIZE: ${CHUNK_SIZE:-500}


services:

  # ── Infraestrutura ────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvore_falhas
      POSTGRES_USER: arvore_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvore_admin -d arvore_falhas"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arvore-internal
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    image: qdrant/qdrant:v1.19
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - arvore-internal
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: arvore_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arvore-internal
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  rustfs-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"
    networks:
      - arvore-internal

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfs-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - arvore-internal
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  rustfs-init:
    build:
      context: ..
    command: ["python", "scripts/init_s3_bucket.py"]
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      S3_BUCKET: ${S3_BUCKET:-plataforma-ati-sandbox}
      S3_REGION: ${S3_REGION:-sa-east-1}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_USE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfs-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks:
      - arvore-internal

  # ── Aplicação ─────────────────────────────────────────────

  api:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "${API_PORT:-9081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    networks:
      - arvore-internal
      - proxy_app-net
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  worker:
    build:
      context: ..
    command: ["python", "-m", "src.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    networks:
      - arvore-internal
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  pgdata:
  qdrant_data:
  rabbitmq_data:
  rustfs_data:


networks:
  arvore-internal:
    driver: bridge
  proxy_app-net:
    external: true